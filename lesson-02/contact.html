<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website | Contact</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container">

            <h1 class="logo">My Website</h1>

            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main>

        <!-- Contact Information -->
        <section class="section">

            <article class="service-card">

            <div class="container hero-content">

                <div class="hero-text">

                 <p class="subtitle"></p>
                <h2>Contact Us</h2>

                <p>
                    Have a question? Send us a message.
                </p>

                <div class="contact-info">

                    <p>
                        <strong>Email:</strong>
                        hello@example.com
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        +6012-345 6789
                    </p>

                </div>

            </div>

        </article>

        </section>


        <!-- Contact Form -->
        <section class="section">

            <div class="container">

                <div class="section-heading">

                <p class="subtitle">
                <h2>Send a Message</h2>
                </p>
                </div>
                <form class="contact-form">

                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Subject -->
                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter subject"
                            required
                        >

                    </div>


                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Enter your message"
                            required
                        ></textarea>

                    </div>


                    <!-- Submit Button -->
                     <center>
                    <button type="submit" class="btn">
                        Send Message
                    </button>
                    </center>

                </form>

            </div>
       

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <p>
                &copy; 2026 My Website. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
